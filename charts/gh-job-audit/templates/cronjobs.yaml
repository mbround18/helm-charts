{{- $jobs := dict
  "report"        (dict "cfg" .Values.report        "args" "daily")
  "usage"         (dict "cfg" .Values.usage         "args" "usage")
  "stale"         (dict "cfg" .Values.stale         "args" "stale")
  "selftest"      (dict "cfg" .Values.selftest      "args" "selftest")
  "triage-assign" (dict "cfg" .Values.triage.assign "args" "triage --assign")
  "triage-report" (dict "cfg" .Values.triage.report "args" "triage --report") }}
{{- range $job, $spec := $jobs }}
{{- $cfg := $spec.cfg }}
{{- if $cfg.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gh-job-audit.fullname" $ }}-{{ $job }}
  labels:
    {{- include "gh-job-audit.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  schedule: {{ $cfg.schedule | quote }}
  suspend: {{ if eq $job "selftest" }}true{{ else }}false{{ end }}   # selftest is trigger-only
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "gh-job-audit.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: {{ $job }}
        spec:
          restartPolicy: Never
          {{- include "gh-job-audit.podBits" $ | nindent 10 }}
          containers:
            - name: {{ $job }}
              image: {{ include "gh-job-audit.image" $ | quote }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args: [{{ range $i, $a := splitList " " $spec.args }}{{ if $i }}, {{ end }}{{ $a | quote }}{{ end }}]
              env:
                {{- include "gh-job-audit.env" $ | nindent 16 }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              volumeMounts:
                - { name: gh-app, mountPath: /var/run/gh-app, readOnly: true }
                - { name: tmp, mountPath: /tmp }
{{- end }}
{{- end }}
