{{- if and .Values.generatedSecrets.enabled (ne (trim (include "vtt-maps-portal.esoEnabled" .)) "true") }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.generatedSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.generatedSecretName }}
  labels:
    {{- include "vtt-maps-portal.labels" . | nindent 4 }}
  {{- $annotations := include "gitops-tools.argocd.annotations" (dict "context" . "phase" "foundation") }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
stringData:
  {{- if $secret }}
  JWT_SECRET_CURRENT: {{ index $secret.data "JWT_SECRET_CURRENT" | b64dec }}
  OAUTH_STATE_SECRET: {{ index $secret.data "OAUTH_STATE_SECRET" | b64dec }}
  RUSTFS_ACCESS_KEY: {{ index $secret.data "RUSTFS_ACCESS_KEY" | b64dec }}
  RUSTFS_SECRET_KEY: {{ index $secret.data "RUSTFS_SECRET_KEY" | b64dec }}
  {{- else }}
  JWT_SECRET_CURRENT: {{ randAlphaNum (int .Values.generatedSecrets.length) | quote }}
  OAUTH_STATE_SECRET: {{ randAlphaNum (int .Values.generatedSecrets.length) | quote }}
  RUSTFS_ACCESS_KEY: {{ randAlphaNum 20 | quote }}
  RUSTFS_SECRET_KEY: {{ randAlphaNum (int .Values.generatedSecrets.length) | quote }}
  {{- end }}
{{- end }}
