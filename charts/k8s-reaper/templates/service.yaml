apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-reaper.fullname" . }}
  labels:
    {{- include "k8s-reaper.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "k8s-reaper.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
