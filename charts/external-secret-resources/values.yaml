# "auto" detects the ExternalSecrets Operator CRDs via .Capabilities and
# enables this chart's resources only when ESO is actually installed;
# "enabled"/"disabled" force the outcome. Leave unset ("") to fall back to
# the legacy `enabled` boolean below for backward compatibility.
mode: ""
enabled: false
annotations: {}
defaults:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    deletionPolicy: Retain
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    labels: {}
generator:
  passwordLength: 32
  allowRepeat: true
  noUpper: false
secrets: {}
