nextcloud:
  image:
    repository: nextcloud
    tag: production-apache
    pullPolicy: Always

  # Hardcoded to match the pre-existing raw-manifest deployment so the
  # StatefulSet's generated PVC name (nextcloud-storage-nextcloud-0) is
  # reused instead of orphaning the Longhorn volume.
  name: nextcloud

  apacheBodyLimit: "0"

  # Bare hostname (no scheme) this instance is reached at, e.g. behind a
  # TLS-terminating gateway/ingress. Wires up NEXTCLOUD_TRUSTED_DOMAINS and
  # the OVERWRITE* env vars so Nextcloud generates correct https:// links
  # instead of rejecting the domain or falling back to the pod's internal
  # http:// address. Left empty by default: unset means none of these env
  # vars are set, matching the chart's previous (broken-behind-a-proxy)
  # behavior.
  trustedDomain: ""

  persistence:
    storageClassName: longhorn
    accessModes: ["ReadWriteMany"]
    size: 60Gi

  resources: {}

  # The upstream nextcloud:apache image starts as root (its entrypoint chowns
  # /var/www/html and Apache binds :80 before dropping to www-data), so it
  # cannot run as non-root. What it can do without: every capability outside
  # this set, privilege escalation via setuid binaries, and syscalls outside
  # the runtime's default seccomp profile. Tested against a fresh install and
  # a restart (the upgrade path) of production-apache.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - FSETID
        - SETGID
        - SETUID
        - NET_BIND_SERVICE
        - KILL

  # Stop advertising the Apache, OS and PHP versions: ServerTokens Prod,
  # ServerSignature Off, TraceEnable Off and expose_php=Off, mounted from a
  # chart-owned ConfigMap after the image's own conf-enabled/security.conf.
  hardening:
    enabled: true

  # Extra volumes and mounts for the nextcloud container, e.g. an Apache
  # conf-enabled override from a ConfigMap.
  extraVolumes: []
  extraVolumeMounts: []

mysql:
  image:
    repository: mysql
    tag: "26"
    pullPolicy: IfNotPresent

  # Hardcoded to match the pre-existing raw-manifest deployment so the
  # StatefulSet's generated PVC name (mysql-storage-mysql-0) is reused
  # instead of orphaning the Longhorn volume.
  name: mysql

  persistence:
    storageClassName: longhorn
    accessModes: ["ReadWriteMany"]
    size: 20Gi

  resources: {}

  # The mysql image runs mysqld as uid 999 and only needs root to chown an
  # empty data dir on first boot; fsGroup covers that on a fresh volume.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

# Secrets are provisioned out-of-band (external-secrets / manual) and
# referenced by name only; this chart never creates them.
secrets:
  mysql:
    name: mysql-secret
  nextcloud:
    name: nextcloud-secret
    adminPasswordKey: NEXTCLOUD_ADMIN_PASSWORD

cron:
  enabled: true
  schedule: "*/5 * * * *"
  # Pinned by digest: a floating tag here runs whatever was pushed last,
  # every five minutes.
  image: quay.io/curl/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93

service:
  port: 80

istio-ingress:
  enabled: false
  virtualService:
    route:
      host: nextcloud
      port: 80

argoCd:
  mode: auto
  instanceLabel: ""
  commonAnnotations: {}
  commonLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
