apiVersion: v2
name: static-pull-thru
description: A pull-through cache for a flaky origin. nginx serves the last good
  copy of each static file while the origin is down, and can inject a small
  "server offline" toast into cached pages.
type: application
version: 0.1.0
appVersion: 1.31.7
dependencies:
  - name: gitops-tools
    version: 0.1.1
    repository: file://../gitops-tools
